services:
  - type: web
    name: razorshield
    env: python
    buildCommand: "pip install -r requirements.txt && chmod +x run_pipeline.sh && ./run_pipeline.sh"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Set these in the Render dashboard, not here, so secrets never
      # land in the repo:
      #   RAZORPAY_WEBHOOK_SECRET
      #   OPENAI_API_KEY (optional)
      #   OPENROUTER_API_KEY (optional)
