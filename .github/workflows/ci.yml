name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      # Runs BEFORE the pipeline, against the committed artifacts. The
      # invariant we care about is "the published prose matches the numbers
      # we shipped" -- checking it after a re-run would instead demand
      # bit-identical results across OS/toolchain, which we do not claim.
      - name: Check committed README/METRICS match committed artifacts
        run: |
          python3 evaluation/report.py
          git diff --exit-code -- README.md METRICS.md             || (echo "README.md / METRICS.md do not match artifacts/. Run: python evaluation/report.py" && exit 1)

      - name: Run pipeline end to end (data -> model -> temporal -> agent -> report -> dashboard)
        run: |
          chmod +x run_pipeline.sh
          ./run_pipeline.sh

      - name: Verify determinism on this runner (two full runs must agree)
        run: |
          cp artifacts/metrics.json /tmp/metrics_run1.json
          ./run_pipeline.sh
          python3 -c "
          import json
          a = json.load(open('/tmp/metrics_run1.json'))
          b = json.load(open('artifacts/metrics.json'))
          assert a == b, 'Pipeline is not deterministic run-to-run -- see README Section 6'
          print('Determinism verified: identical metrics.json across two full runs')
          "

      - name: Run test suite
        run: python3 -m pytest tests/ -v
